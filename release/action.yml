name: Publish tested addon release
description: Publish the exact verified ZIP to GitHub before registering its exact tag with GDAM by trusted publishing; the job needs contents write and id-token write
inputs:
  tag:
    description: Exact case-sensitive release tag already checked against addon metadata
    required: true
  asset:
    description: Path to the ZIP verified by this job's full addon checks
    required: true
  tested-sha256:
    description: SHA256 recorded immediately after the required package verification
    required: true
  addon:
    description: Exact addon spec, or the caller repository by default
    required: false
    default: ''
  api-url:
    description: Registry base URL
    required: false
    default: 'https://api.gdam.dev'
runs:
  using: composite
  steps:
    - name: Publish exact tested release
      shell: bash
      env:
        GDAM_RELEASE_TAG: ${{ inputs.tag }}
        GDAM_RELEASE_ASSET: ${{ inputs.asset }}
        GDAM_RELEASE_SHA256: ${{ inputs.tested-sha256 }}
        GDAM_PUBLISH_ADDON: ${{ inputs.addon }}
        GDAM_API_URL: ${{ inputs.api-url }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/release.py"
