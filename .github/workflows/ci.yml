name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches:
      - main
  # Callable, so Release runs exactly these checks rather than a copy of them.
  # A reusable WORKFLOW rather than a composite action, because the install job
  # is a matrix over two operating systems and a matrix belongs to a job -- a
  # composite action cannot own one, so reusing it that way would have meant
  # rewriting the matrix in the caller and letting the two drift.
  workflow_call:

permissions:
  contents: read

# TWO JOBS, BOTH LOAD-BEARING. The organisation's rule is one job per
# workflow; this file is the documented exception, for two independent reasons.
#
#   `install` is a matrix across ubuntu and macos. A composite action cannot
#   express a matrix, and collapsing this to one runner would silently drop the
#   macOS coverage that nothing else provides.
#
#   `publish-guards` asserts that publish FAILS closed for a missing release
#   and for a job without id-token: write. It needs its own permissions block
#   (the token request is part of what it exercises) and the loopback registry
#   fixtures from make test, neither of which belongs in the install matrix.
jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both platforms the install script supports. Every consumer runs on
        # Linux today, but macOS is a supported target and nothing else checks it.
        include:
          - os: ubuntu-latest
            runner: blacksmith-2vcpu-ubuntu-2404
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the exact public CLI
        id: exact
        uses: ./install
        with:
          version: v0.0.8
          archive-sha256: ${{ matrix.os == 'ubuntu-latest' && '7ef2a325ad1416ce850a332f4380b1b290bd7a56e2a20f544536386cf64abb92' || '' }}

      - name: gdam is on PATH and runs
        shell: bash
        run: |
          set -euo pipefail
          command -v gdam
          got="$(gdam --version | head -n 1)"
          echo "reported: $got"
          [ "$got" = "gdam 0.0.8" ] || { echo "expected gdam 0.0.8, got: $got" >&2; exit 1; }
          [ "${{ steps.exact.outputs.version }}" = "gdam 0.0.8" ] \
            || { echo "install output did not report gdam 0.0.8" >&2; exit 1; }

      - name: Install a pinned version
        id: pinned
        uses: ./install
        with:
          version: v0.0.6
          install-dir: ${{ runner.temp }}/gdam-pinned

      - name: The pinned version is the one installed
        shell: bash
        run: |
          set -euo pipefail
          got="$("${{ runner.temp }}/gdam-pinned/gdam" --version | head -n 1)"
          echo "reported: $got"
          [ "$got" = "gdam 0.0.6" ] || { echo "expected gdam 0.0.6, got: $got" >&2; exit 1; }

      - name: A version without the leading v resolves the same
        uses: ./install
        with:
          version: '0.0.6'
          install-dir: ${{ runner.temp }}/gdam-nov

      - name: Both spellings agree
        shell: bash
        run: |
          set -euo pipefail
          a="$("${{ runner.temp }}/gdam-pinned/gdam" --version | head -n 1)"
          b="$("${{ runner.temp }}/gdam-nov/gdam" --version | head -n 1)"
          [ "$a" = "$b" ] || { echo "v0.0.6 gave '$a' but 0.0.6 gave '$b'" >&2; exit 1; }

  publish-guards:
    name: Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: read
      # Publishing is trusted publishing: the guard below requests a real
      # GitHub Actions OIDC token exactly as a consumer's release job does.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate unified workflow contract
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/fleet-workflow-contract"
          "$RUNNER_TEMP/fleet-workflow-contract/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/workflow-contract-requirements.txt
          "$RUNNER_TEMP/fleet-workflow-contract/bin/python" .github/workflow_contract.py

      - name: Trusted-publishing and immutable-source contract tests
        run: make test

      # The ways publish is misused. Each should fail with a message that
      # names the cause, which is the whole reason the guards exist. The job
      # holds id-token: write so the guard exercises the real OIDC plumbing
      # up to the point where the release lookup fails; nothing is minted or
      # sent to the registry for a release that does not exist.
      - name: Fails when the release does not exist
        id: no-release
        continue-on-error: true
        uses: ./publish
        with:
          tag: 'Release-V1.2.3'

      - name: That failure was expected
        shell: bash
        run: |
          [ "${{ steps.no-release.outcome }}" = "failure" ] \
            || { echo 'publish should fail when the release tag does not exist' >&2; exit 1; }

      - name: Fails without an OIDC token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GDAM_PUBLISH_TAG: 'Release-V1.2.3'
        run: |
          set -euo pipefail
          if env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              python3 publish/publish.py >"$RUNNER_TEMP/no-token.out" 2>"$RUNNER_TEMP/no-token.err"; then
            echo 'publish should fail when the job lacks id-token: write' >&2; exit 1
          fi
          grep -F 'id-token: write' "$RUNNER_TEMP/no-token.err"
