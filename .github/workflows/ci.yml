name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: null
  push:
    branches:
    - main
  workflow_call: null
permissions:
  contents: read
jobs:
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          runner: ubuntu-24.04
        - os: macos-latest
          runner: macos-latest
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Install gdam
      id: exact
      uses: ./install
      with:
        version: v0.0.8
        archive-sha256: ${{ matrix.os == 'ubuntu-latest' && '7ef2a325ad1416ce850a332f4380b1b290bd7a56e2a20f544536386cf64abb92'
          || '' }}
    - name: gdam is on PATH and runs
      shell: bash
      run: |-
        set -euo pipefail
        command -v gdam
        got="$(gdam --version | head -n 1)"
        echo "reported: $got"
        [ "$got" = "gdam 0.0.8" ] || { echo "expected gdam 0.0.8, got: $got" >&2; exit 1; }
        [ "${{ steps.exact.outputs.version }}" = "gdam 0.0.8" ] \
          || { echo "install output did not report gdam 0.0.8" >&2; exit 1; }
    - name: Install gdam
      id: pinned
      uses: ./install
      with:
        version: v0.0.6
        install-dir: ${{ runner.temp }}/gdam-pinned
    - name: The pinned version is the one installed
      shell: bash
      run: |-
        set -euo pipefail
        got="$("${{ runner.temp }}/gdam-pinned/gdam" --version | head -n 1)"
        echo "reported: $got"
        [ "$got" = "gdam 0.0.6" ] || { echo "expected gdam 0.0.6, got: $got" >&2; exit 1; }
    - name: Install gdam
      uses: ./install
      with:
        version: 0.0.6
        install-dir: ${{ runner.temp }}/gdam-nov
    - name: Both spellings agree
      shell: bash
      run: |-
        set -euo pipefail
        a="$("${{ runner.temp }}/gdam-pinned/gdam" --version | head -n 1)"
        b="$("${{ runner.temp }}/gdam-nov/gdam" --version | head -n 1)"
        [ "$a" = "$b" ] || { echo "v0.0.6 gave '$a' but 0.0.6 gave '$b'" >&2; exit 1; }
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish-guards:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Trusted-publishing and immutable-source contract tests
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Publish addon
      id: no-release
      continue-on-error: true
      uses: ./publish
      with:
        tag: Release-V1.2.3
    - name: That failure was expected
      shell: bash
      run: |-
        [ "${{ steps.no-release.outcome }}" = "failure" ] \
          || { echo 'publish should fail when the release tag does not exist' >&2; exit 1; }
    - name: Fails without an OIDC token
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GDAM_PUBLISH_TAG: Release-V1.2.3
      run: |-
        set -euo pipefail
        if env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            python3 publish/publish.py >"$RUNNER_TEMP/no-token.out" 2>"$RUNNER_TEMP/no-token.err"; then
          echo 'publish should fail when the job lacks id-token: write' >&2; exit 1
        fi
        grep -F 'id-token: write' "$RUNNER_TEMP/no-token.err"
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
