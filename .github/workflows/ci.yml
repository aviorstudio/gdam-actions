name: Build & Test
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: null
  push:
    branches:
    - main
  workflow_call: null
permissions:
  contents: read
jobs:
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: Linux-x86_64
          runner: ubuntu-24.04
          archive-sha256: 9b4ee0fe4e54f588e67624f876e17dc4fb2681eab3d047ded268b27340688b5b
        - os: Darwin-arm64
          runner: macos-15
          archive-sha256: cc2150fe9e8b4a22b942cac12fccb87ad2d8d7bba4a3b802f2147156009a46aa
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@aa362a30ca7b15e2e5d4196a3ece98a56659e5bc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Install gdam
      id: exact
      uses: ./install
      with:
        version: v0.2.3
        archive-sha256: ${{ matrix.archive-sha256 }}
    - name: gdam is on PATH and runs
      shell: bash
      run: |-
        set -euo pipefail
        command -v gdam
        got="$(gdam --version | head -n 1)"
        echo "reported: $got"
        [ "$got" = "gdam v0.2.3" ] || { echo "expected gdam v0.2.3, got: $got" >&2; exit 1; }
        [ "${{ steps.exact.outputs.version }}" = "gdam v0.2.3" ] \
          || { echo "install output did not report gdam v0.2.3" >&2; exit 1; }
        gdam --json version | python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["ok"] is True and v["result"]["version"]=="v0.2.3" and v["result"]["commit"]=="8c52a5f1a72101947c500ff3e799e5d9876d24a2"'
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish-guards:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@aa362a30ca7b15e2e5d4196a3ece98a56659e5bc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: true
    - name: Trusted-publishing and immutable-source contract tests
      shell: bash
      run: |-
        set -euo pipefail
        mise run check
    - name: Publish addon
      id: no-release
      continue-on-error: true
      uses: ./publish
      with:
        tag: Release-V1.2.3
    - name: That failure was expected
      shell: bash
      run: |-
        [ "${{ steps.no-release.outcome }}" = "failure" ] \
          || { echo 'publish should fail when the release tag does not exist' >&2; exit 1; }
    - name: Fails without an OIDC token
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GDAM_PUBLISH_TAG: Release-V1.2.3
      run: |-
        set -euo pipefail
        if env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            python3 publish/publish.py >"$RUNNER_TEMP/no-token.out" 2>"$RUNNER_TEMP/no-token.err"; then
          echo 'publish should fail when the job lacks id-token: write' >&2; exit 1
        fi
        grep -F 'id-token: write' "$RUNNER_TEMP/no-token.err"
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
